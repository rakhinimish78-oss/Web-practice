<html>
<head>
    <title>Details of Users</title>
</head>
<body>
<form>
    <fieldset>
    <Legend>Personal Information</Legend>
        <label>First name: </label>
        <input type="text" id="first-name"><br><br>
        <label>Last name: </label>
        <input type="text" id="last-name"><br><br>
        <label>Gender: </label>
        <input type="radio" id="gender" name="gender" value="male">Male
        <input type="radio" id="gender" name="gender" value="female">Female
        <input type="radio" id="gender" name="gender" value="other">Other<br><br>
        <label>Email: </label>
        <input type="email" id="email"><br><br>
        <label>Password: </label>
        <input type="password" id="password"><br><br>
        <label>Birthday: </label>
        <input type="date" id="birthday"><br><br>
        <label>Address: </label>
        <textarea id="address" rows="4" cols="50"></textarea><br><br>
        <label>Image: </label>
        <input type="file" id="image"><br><br>
        <input type="submit" value="Submit">
    <input type="reset" value="Reset"><br><br>
    </form>
</fieldset> 
</body>
</html>
