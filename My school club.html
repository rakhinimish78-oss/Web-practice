<!DOCTYPE html>
<html>
<head>
  <title>School Club Website</title>
  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    body {
      background-color: #cbb7b7;
      font-family: Arial, sans-serif;
      padding: 30px 15px;
    }
    h1 {
      text-align: center;
      color: #421a4a;
    }
    .club-card {
      text-align: center;
      border: 2px solid #9a51a5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background-color: #fff8e1;
    }
    .club-card h3 {
      color: #a462b4;
    }
  </style>
</head>
<body>

  <h1>My School Clubs</h1>
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Coding Club</h3>
          <p>I learn how to create websites and apps. </p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Science Club</h3>
          <p>I enjoy doing experiments and discovering how things work.</p>
        </div>
      </div>
<div class="col-12 col-md-12 col-lg-4">
        <div class="club-card">
          <h3>Reading Club</h3>
          <p>I love reading books.</p>
        </div>
      </div>


    </div>
  </div>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
  </script>

</body>
</html>
